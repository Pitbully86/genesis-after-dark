<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Walkable 3D model of the Genesis After Dark podcast set.">
<title>Genesis After Dark Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600&family=Cinzel:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --ink: #0b0a0d;
    --panel: rgba(17, 15, 19, 0.86);
    --panel-solid: #141217;
    --line: rgba(255, 240, 230, 0.12);
    --text: #efe8e1;
    --muted: #a39990;
    --amber: #f2b640;
    --red: #ff4b37;
    --blue: #4d9dff;
    --white: #f4efe9;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; background: var(--ink); color: var(--text); overflow: hidden; }
  body { margin: 0; font-family: var(--body); font-size: 14px; }
  #app { position: fixed; inset: 0; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; }
  #c:active { cursor: grabbing; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* ---------- brand ---------- */
  .brand {
    position: absolute; left: 16px; top: calc(14px + env(safe-area-inset-top, 0px));
    pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,.8);
  }
  .brand .eyebrow { font: 600 11px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .brand h1 { margin: 4px 0 0; font: 700 28px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
  .brand h1 em { font-style: italic; color: var(--red); }

  .help {
    position: absolute; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px));
    max-width: 280px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); font: 400 12px/1.45 var(--body); color: var(--muted);
  }
  .help kbd { font: 500 11px var(--mono); color: var(--text); padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: absolute; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; pointer-events: none;
  }
  .group {
    pointer-events: auto; display: flex; align-items: stretch; gap: 2px; padding: 3px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .group .gl { align-self: center; padding: 0 6px 0 6px; font: 600 10px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .tb {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border: 0; border-radius: 5px;
    background: transparent; font: 600 13px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer;
  }
  .tb:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .tb[aria-pressed="true"] { color: var(--text); background: rgba(255,255,255,.1); }
  .tb .sw { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .35; }
  .tb[aria-pressed="true"] .sw { opacity: 1; box-shadow: 0 0 8px currentColor; }
  .sw.amber { color: var(--amber); } .sw.red { color: var(--red); } .sw.blue { color: var(--blue); } .sw.white { color: var(--white); }


  /* ---------- look-through ---------- */
  #frame { position: absolute; pointer-events: none; }
  #frame .thirds {
    position: absolute; inset: 0;
    background:
      linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.28) calc(33.33% - .5px), rgba(255,255,255,.28) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.28) calc(66.66% - .5px), rgba(255,255,255,.28) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
      linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.28) calc(33.33% - .5px), rgba(255,255,255,.28) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.28) calc(66.66% - .5px), rgba(255,255,255,.28) calc(66.66% + .5px), transparent calc(66.66% + .5px));
  }
  #frame .osd { position: absolute; left: 12px; top: 10px; font: 500 12px/1.4 var(--mono); color: #fff; text-shadow: 0 1px 4px #000; }
  #frame .osd .rec { color: #ff3b30; }
  .lookbar {
    position: absolute; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px));
    display: flex; gap: 4px; align-items: center; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  }
  .looking .brand, .looking .help { display: none; }

  /* ---------- walk pad ---------- */
  .pad { position: absolute; left: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 48px); gap: 6px; }
  .pad button { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 18px; color: var(--text); touch-action: none; user-select: none; -webkit-user-select: none; }
  .pad .up { grid-column: 2; grid-row: 1; } .pad .lt { grid-column: 1; grid-row: 2; } .pad .dn { grid-column: 2; grid-row: 2; } .pad .rt { grid-column: 3; grid-row: 2; }
  .pad button.held { background: rgba(255,255,255,.15); }

  .loading { position: absolute; inset: 0; display: grid; place-items: center; font: 600 14px var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); pointer-events: none; }

  @media (max-width: 720px) {
    .brand h1 { font-size: 22px; }
    .help { display: none; }
    .tb { padding: 7px 8px; font-size: 12px; }
    .group .gl { display: none; }
  }
</style>
</head>
<body>

<div id="app">
  <canvas id="c" tabindex="0" aria-label="3D view of the Genesis After Dark podcast set"></canvas>
  <div class="loading" id="loading">Building set…</div>
  <div id="frame" hidden>
    <div class="thirds"></div>
    <div class="osd"><span class="rec">● REC</span> <span id="osdName"></span><br><span id="osdSpec"></span></div>
  </div>

  <div class="brand">
    <div class="eyebrow">Studio set walkthrough</div>
    <h1>Genesis <em>After Dark</em></h1>
  </div>

  <div class="help" id="help"></div>

  <div class="lookbar" id="lookbar" hidden>
    <button class="tb" data-look="cam2" aria-pressed="false"><span class="sw red"></span>Cam 2 · Bob</button>
    <button class="tb" data-look="iphone" aria-pressed="false"><span class="sw white"></span>iPhone wide</button>
    <button class="tb" data-look="cam1" aria-pressed="false"><span class="sw blue"></span>Cam 1 · Bryson</button>
    <button class="tb" id="exitLook" aria-pressed="false">Exit ✕</button>
  </div>

  <div class="pad" id="pad" hidden>
    <button class="up" data-k="KeyW" aria-label="Forward">▲</button>
    <button class="lt" data-k="KeyA" aria-label="Left">◀</button>
    <button class="dn" data-k="KeyS" aria-label="Back">▼</button>
    <button class="rt" data-k="KeyD" aria-label="Right">▶</button>
  </div>

  <div class="toolbar" id="toolbar">
    <div class="group">
      <span class="gl">Move</span>
      <button class="tb" id="mOrbit" aria-pressed="true">Orbit</button>
      <button class="tb" id="mWalk" aria-pressed="false">Walk</button>
    </div>
    <div class="group">
      <span class="gl">Look through</span>
      <button class="tb" data-look="cam2" aria-pressed="false"><span class="sw red"></span>Cam 2</button>
      <button class="tb" data-look="iphone" aria-pressed="false"><span class="sw white"></span>iPhone</button>
      <button class="tb" data-look="cam1" aria-pressed="false"><span class="sw blue"></span>Cam 1</button>
    </div>
    <div class="group">
      <span class="gl">Lights</span>
      <button class="tb" id="lKey" aria-pressed="true"><span class="sw amber"></span>Key</button>
      <button class="tb" id="lRim" aria-pressed="true"><span class="sw red"></span>Rim</button>
      <button class="tb" id="lWash" aria-pressed="true"><span class="sw blue"></span>Wall</button>
      <button class="tb" id="lHouse" aria-pressed="false"><span class="sw white"></span>Room</button>
    </div>
    <div class="group">
      <button class="tb" id="tHosts" aria-pressed="true">Hosts</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V3 = THREE.Vector3;
const PI = Math.PI;
const $ = (id) => document.getElementById(id);
const app = $('app');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = rng(42);

/* ---------------- renderer / scene ---------------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060508);
scene.fog = new THREE.FogExp2(0x0a080c, 0.03);

const camera = new THREE.PerspectiveCamera(58, 1, 0.03, 60);
camera.position.set(1.1, 1.9, 4.15);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.0, -1.3);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.3;
controls.maxDistance = 7.5;
controls.maxPolarAngle = PI * 0.93;
controls.update();

/* ---------------- helpers ---------------- */
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0, ...o });
function mesh(geo, material, { cast = true, receive = true } = {}) { const m = new THREE.Mesh(geo, material); m.castShadow = cast; m.receiveShadow = receive; return m; }
function add(parent, geo, material, x = 0, y = 0, z = 0, opts) { const m = mesh(geo, material, opts); m.position.set(x, y, z); parent.add(m); return m; }
function cylBetween(a, b, r, material, seg = 8) {
  const d = new V3().subVectors(b, a); const len = d.length();
  const m = mesh(new THREE.CylinderGeometry(r, r, len, seg), material);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new V3(0, 1, 0), d.normalize());
  return m;
}
function canvasTex(w, h, draw, { repeat, srgb = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  t.anisotropy = 4;
  return t;
}
function tag(obj, id) { obj.traverse((o) => { o.userData.hot = id; }); return obj; }

/* ---------------- materials ---------------- */
const M = {
  black: mat(0x121213, { roughness: 0.55 }),
  metal: mat(0x3a3b3e, { roughness: 0.35, metalness: 0.85 }),
  grille: mat(0x2a2a2c, { roughness: 0.45, metalness: 0.7 }),
  fabric: mat(0x3b3b40, { roughness: 0.95 }),
  wood: mat(0x6e4a26, { roughness: 0.6 }),
  wall: mat(0x2b2426, { roughness: 0.95 }),
  ceiling: mat(0x141116, { roughness: 1 }),
  curtain: mat(0x0c0b0e, { roughness: 1 }),
  leaf: mat(0x1f3b24, { roughness: 0.75, side: THREE.DoubleSide }),
  pot: mat(0x1a1818, { roughness: 0.7 }),
  host: mat(0x8f857c, { roughness: 0.85 }),
  hostShirt: mat(0x2a2c33, { roughness: 0.9 }),
  cable: mat(0x8e1512, { roughness: 0.5, emissive: 0x2a0303 }),
  cableBlack: mat(0x101010, { roughness: 0.6 }),
};

/* ---------------- room ---------------- */
const ROOM = { w: 8, d: 9, h: 2.8 };
{
  const carpet = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#231e21'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { const v = 18 + rand() * 30 | 0; g.fillStyle = `rgb(${v + 8},${v},${v + 4})`; g.fillRect(rand() * w, rand() * h, 1.5, 1.5); }
  }, { repeat: [10, 11] });
  const floor = mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), mat(0xffffff, { map: carpet, roughness: 1 }), { cast: false });
  floor.rotation.x = -PI / 2; scene.add(floor);
  const ceil = mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), M.ceiling, { cast: false });
  ceil.rotation.x = PI / 2; ceil.position.y = ROOM.h; scene.add(ceil);
  const walls = [
    [0, -ROOM.d / 2, 0, ROOM.w], [0, ROOM.d / 2, PI, ROOM.w],
    [-ROOM.w / 2, 0, PI / 2, ROOM.d], [ROOM.w / 2, 0, -PI / 2, ROOM.d],
  ];
  for (const [x, z, ry, w] of walls) {
    const m = mesh(new THREE.PlaneGeometry(w, ROOM.h), M.wall, { cast: false });
    m.position.set(x, ROOM.h / 2, z); m.rotation.y = ry; scene.add(m);
    const base = mesh(new THREE.BoxGeometry(w, 0.1, 0.02), mat(0x1a1517), { cast: false });
    base.position.set(x, 0.05, z); base.rotation.y = ry; base.translateZ(0.01); scene.add(base);
  }
}

/* ---------------- table ---------------- */
const TABLE = { x: 0, z: 0.2, w: 1.15, len: 4.45, y: 0.75 };
{
  const speck = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#1b1a1b'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 16000; i++) { const v = 40 + rand() * 90 | 0; g.fillStyle = `rgba(${v},${v - 4},${v - 6},${0.25 + rand() * 0.5})`; g.fillRect(rand() * w, rand() * h, 1.2, 1.2); }
  }, { repeat: [1.2, 4] });
  const g = new THREE.Group();
  add(g, new THREE.BoxGeometry(TABLE.w, 0.045, TABLE.len), mat(0xffffff, { map: speck, roughness: 0.28, metalness: 0.15 }), 0, TABLE.y - 0.0225, 0);
  add(g, new THREE.BoxGeometry(TABLE.w + 0.05, 0.035, TABLE.len + 0.05), M.wood, 0, TABLE.y - 0.06, 0);
  add(g, new THREE.BoxGeometry(0.55, TABLE.y - 0.08, 0.07), M.black, 0, (TABLE.y - 0.08) / 2, -TABLE.len / 2 + 0.6);
  add(g, new THREE.BoxGeometry(0.55, TABLE.y - 0.08, 0.07), M.black, 0, (TABLE.y - 0.08) / 2, TABLE.len / 2 - 0.6);
  add(g, new THREE.BoxGeometry(0.8, 0.03, 0.45), M.black, 0, 0.015, -TABLE.len / 2 + 0.6);
  add(g, new THREE.BoxGeometry(0.8, 0.03, 0.45), M.black, 0, 0.015, TABLE.len / 2 - 0.6);
  g.position.set(TABLE.x, 0, TABLE.z);
  scene.add(g);
}
const TABLE_TOP = TABLE.y;
const TABLE_FRONT = TABLE.z + TABLE.len / 2;

/* ---------------- chairs & hosts ---------------- */
function makeChair() {
  const g = new THREE.Group();
  add(g, new THREE.BoxGeometry(0.54, 0.09, 0.5), M.fabric, 0, 0.45, 0.02);
  const back = add(g, new THREE.BoxGeometry(0.54, 0.46, 0.08), M.fabric, 0, 0.74, -0.23);
  back.rotation.x = -0.14;
  for (const s of [-1, 1]) {
    add(g, new THREE.BoxGeometry(0.06, 0.035, 0.44), M.wood, s * 0.3, 0.64, 0.02);
    add(g, new THREE.BoxGeometry(0.035, 0.18, 0.035), M.wood, s * 0.3, 0.54, 0.2);
    for (const t of [-1, 1]) add(g, new THREE.CylinderGeometry(0.018, 0.015, 0.41, 8), M.wood, s * 0.22, 0.205, t * 0.2);
  }
  return g;
}
function makeHost() {
  const g = new THREE.Group();
  add(g, new THREE.BoxGeometry(0.36, 0.14, 0.44), M.hostShirt, 0, 0.56, 0.1);
  add(g, new THREE.BoxGeometry(0.32, 0.46, 0.12), M.hostShirt, 0, 0.25, 0.32);
  const torso = add(g, new THREE.CapsuleGeometry(0.16, 0.3, 6, 14), M.hostShirt, 0, 0.87, -0.06);
  torso.scale.set(1.15, 1, 0.75);
  add(g, new THREE.CylinderGeometry(0.05, 0.055, 0.08, 10), M.host, 0, 1.12, -0.04);
  const head = add(g, new THREE.SphereGeometry(0.105, 24, 16), M.host, 0, 1.25, -0.02);
  head.scale.set(0.92, 1.1, 1);
  const nose = add(g, new THREE.ConeGeometry(0.022, 0.05, 10).rotateX(PI / 2), M.host, 0, 1.24, 0.1);
  for (const s of [-1, 1]) add(g, new THREE.SphereGeometry(0.013, 8, 6), M.black, s * 0.035, 1.28, 0.083);
  for (const s of [-1, 1]) {
    const up = add(g, new THREE.CapsuleGeometry(0.045, 0.24, 4, 8), M.hostShirt, s * 0.24, 0.86, -0.04);
    up.rotation.x = 0.35;
    const fore = add(g, new THREE.CapsuleGeometry(0.04, 0.26, 4, 8), M.host, s * 0.28, 0.68, 0.14);
    fore.rotation.x = PI / 2;
  }
  return g;
}

const HOSTS = {
  bob: { name: 'Bob', seat: new V3(-0.95, 0, -1.35), yaw: 0.46 },
  bryson: { name: 'Bryson', seat: new V3(0.95, 0, -1.35), yaw: -0.46 },
};
const hostGroup = new THREE.Group(); scene.add(hostGroup);
for (const [id, h] of Object.entries(HOSTS)) {
  const chair = makeChair(); chair.position.copy(h.seat); chair.rotation.y = h.yaw; scene.add(chair);
  const body = makeHost(); body.position.copy(h.seat); body.rotation.y = h.yaw; hostGroup.add(body);
  tag(body, id);
  body.updateMatrixWorld(true);
  h.head = body.localToWorld(new V3(0, 1.25, -0.02));
  h.face = new V3(Math.sin(h.yaw), 0, Math.cos(h.yaw));
  h.mouth = h.head.clone().addScaledVector(h.face, 0.1).add(new V3(0, -0.07, 0));
}
// empty chairs
for (const [x, z, ry] of [[-1.0, 0.45, PI / 2], [1.0, 0.45, -PI / 2], [0, -2.4, 0]]) {
  const c = makeChair(); c.position.set(x, 0, z); c.rotation.y = ry; scene.add(c);
}

/* ---------------- audio: mics, headphones, interface ---------------- */
const MICS = {};
function makeMic(base, aim) {
  const g = new THREE.Group();
  add(g, new THREE.CylinderGeometry(0.085, 0.095, 0.018, 28), M.black, base.x, base.y + 0.009, base.z);
  const top = base.clone().add(new V3(0, 0.3, 0));
  g.add(cylBetween(base, top, 0.008, M.metal));
  const head = new THREE.Group(); head.position.copy(top); head.lookAt(aim);
  add(head, new THREE.BoxGeometry(0.085, 0.012, 0.014), M.metal, 0, 0, 0);
  add(head, new THREE.CylinderGeometry(0.034, 0.03, 0.17, 24).rotateX(PI / 2), M.black, 0, 0, 0.04);
  add(head, new THREE.CylinderGeometry(0.037, 0.037, 0.07, 24).rotateX(PI / 2), M.grille, 0, 0, 0.155);
  g.add(head);
  return { g, grille: head.localToWorld(new V3(0, 0, 0.19)) };
}
const IFACE = new V3(0, TABLE_TOP, 0.95);
{
  const audio = new THREE.Group(); scene.add(audio);
  for (const [id, x] of [['bob', -0.42], ['bryson', 0.42]]) {
    const base = new V3(x, TABLE_TOP, -1.12);
    const h = HOSTS[id];
    const { g, grille } = makeMic(base, h.mouth);
    audio.add(g); MICS[id] = { base, grille };
    // red XLR run to interface
    const s = Math.sign(x);
    const pts = [base.clone().add(new V3(-s * 0.02, 0.004, 0.07)), new V3(x * 0.8, TABLE_TOP + 0.005, -0.6), new V3(x * 0.55, TABLE_TOP + 0.005, -0.05), new V3(x * 0.7, TABLE_TOP + 0.005, 0.45), new V3(s * 0.1, TABLE_TOP + 0.005, 0.85), IFACE.clone().add(new V3(s * 0.08, 0.03, -0.07))];
    audio.add(mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 60, 0.005, 6), M.cable, { cast: false }));
    // headphones
    const hp = new THREE.Group();
    add(hp, new THREE.TorusGeometry(0.085, 0.013, 8, 28, PI), M.black, 0, 0, 0);
    for (const t of [-1, 1]) add(hp, new THREE.CylinderGeometry(0.048, 0.048, 0.04, 20).rotateZ(PI / 2), M.black, t * 0.085, -0.01, 0);
    hp.rotation.set(-PI / 2, 0, s * 0.4);

  $('help').innerHTML = mode === 'orbit'
    ? 'Drag to orbit · right-drag or two fingers to pan · scroll to zoom. <kbd>V</kbd> walk · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> look through cameras'
    : 'Drag to look · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows to walk · <kbd>Shift</kbd> faster. <kbd>V</kbd> back to orbit';
}
$('mOrbit').addEventListener('click', () => setMode('orbit'));
$('mWalk').addEventListener('click', () => setMode('walk'));

function clampWalk(p) {
  p.x = THREE.MathUtils.clamp(p.x, -3.7, 3.7); p.z = THREE.MathUtils.clamp(p.z, -4.2, 4.2);
  const bx = TABLE.w / 2 + 0.3, bz0 = TABLE.z - TABLE.len / 2 - 0.3, bz1 = TABLE.z + TABLE.len / 2 + 0.3;
  if (Math.abs(p.x) < bx && p.z > bz0 && p.z < bz1) {
    const dx = bx - Math.abs(p.x), dz0 = p.z - bz0, dz1 = bz1 - p.z; const m = Math.min(dx, dz0, dz1);
    if (m === dx) p.x = Math.sign(p.x || 1) * bx; else if (m === dz0) p.z = bz0; else p.z = bz1;
  }
}
function clampRoom(p) {
  p.x = THREE.MathUtils.clamp(p.x, -3.88, 3.88); p.y = THREE.MathUtils.clamp(p.y, 0.15, 2.7); p.z = THREE.MathUtils.clamp(p.z, -4.38, 4.38);
}

// pointer: drag-look in walk mode
let down = null;
canvas.addEventListener('pointerdown', (e) => {
  down = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: 0 };
  if (mode === 'walk') canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!down) return;
  const dx = e.clientX - down.lx, dy = e.clientY - down.ly; down.lx = e.clientX; down.ly = e.clientY;
  down.moved += Math.abs(dx) + Math.abs(dy);
  if (mode === 'walk' && !lookDev) { yaw -= dx * 0.004; pitch = THREE.MathUtils.clamp(pitch - dy * 0.004, -1.2, 1.2); }
});
canvas.addEventListener('pointerup', () => { down = null; });
canvas.addEventListener('pointercancel', () => { down = null; });

addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  keys.add(e.code);
  if (e.code === 'KeyV') setMode(mode === 'walk' ? 'orbit' : 'walk');
  if (e.code === 'Digit1') setLook('cam1');
  if (e.code === 'Digit2') setLook('cam2');
  if (e.code === 'Digit3') setLook('iphone');
  if (e.code === 'Escape' && lookDev) setLook(null);
  if (mode === 'walk' && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
for (const b of $('pad').querySelectorAll('button')) {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); keys.add(k); b.classList.add('held'); b.setPointerCapture(e.pointerId); });
  const up = () => { keys.delete(k); b.classList.remove('held'); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
}

/* ---------------- look-through ---------------- */
let lookDev = null;
function setLook(id) {
  lookDev = id ? DEV[id] : null;
  app.classList.toggle('looking', !!lookDev);
  $('frame').hidden = !lookDev; $('lookbar').hidden = !lookDev;
  $('toolbar').hidden = !!lookDev; $('pad').hidden = !!lookDev || !(mode === 'walk' && matchMedia('(pointer: coarse)').matches);
  document.querySelectorAll('[data-look]').forEach((b) => b.setAttribute('aria-pressed', !!lookDev && b.dataset.look === id));
  if (lookDev) {
    $('osdName').textContent = lookDev.name;
    $('osdSpec').textContent = lookDev.spec;
  }
}
document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('[data-look]');
  if (b) setLook(lookDev && lookDev.id === b.dataset.look ? null : b.dataset.look);
});
$('exitLook').addEventListener('click', () => setLook(null));

/* ---------------- toggles ---------------- */
function toggle(btnId, fn) {
  const b = $(btnId);
  b.addEventListener('click', () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); fn(on); renderer.shadowMap.needsUpdate = true; });
}
toggle('lKey', (on) => { LIGHTS.key.forEach((l) => (l.visible = on)); LIGHTS.keyFaces.forEach((m) => m.color.copy(on ? KEY_ON : KEY_OFF)); });
toggle('lRim', (on) => { LIGHTS.rim.forEach((l) => (l.visible = on)); LIGHTS.rimTubes.forEach((t) => t.m.color.copy(on ? t.on : KEY_OFF)); });
toggle('lWash', (on) => LIGHTS.wash.forEach((l) => (l.visible = on)));
toggle('lHouse', (on) => { hemi.intensity = on ? 1.0 : 0.35; house.intensity = on ? 14 : 0; });
toggle('tHosts', (on) => { hostGroup.visible = on; });

/* ---------------- loop ---------------- */
function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
const tmp = new V3();
let frame = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  frame++;

  if (tween) {
    tween.t += dt; const k = Math.min(tween.t / tween.dur, 1); const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (k >= 1) tween = null;
  }
  if (mode === 'walk') {
    const sp = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 3.2 : 1.5) * dt;
    const fwd = new V3(-Math.sin(yaw), 0, -Math.cos(yaw)), right = new V3(Math.cos(yaw), 0, -Math.sin(yaw));
    const mv = new V3();
    if (keys.has('KeyW') || keys.has('ArrowUp')) mv.add(fwd);
    if (keys.has('KeyS') || keys.has('ArrowDown')) mv.sub(fwd);
    if (keys.has('KeyD') || keys.has('ArrowRight')) mv.add(right);
    if (keys.has('KeyA') || keys.has('ArrowLeft')) mv.sub(right);
    if (mv.lengthSq()) camera.position.addScaledVector(mv.normalize(), sp);
    clampWalk(camera.position);
    camera.rotation.set(pitch, yaw, 0, 'YXZ');
  } else {
    controls.update();
    clampRoom(camera.position);
  }

  // live feeds on each device's screen
  if (frame % 2 === 0) {
    for (const d of Object.values(DEV)) { renderer.setRenderTarget(d.rt); renderer.render(scene, d.cam); }
    renderer.setRenderTarget(null);
  }

  const W = app.clientWidth, H = app.clientHeight;
  if (lookDev) {
    const a = 16 / 9; let vw = W, vh = W / a; if (vh > H) { vh = H; vw = H * a; }
    const x = (W - vw) / 2, y = (H - vh) / 2;
    renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H); renderer.setClearColor(0x000000, 1); renderer.clear();
    renderer.setScissorTest(true); renderer.setScissor(x, y, vw, vh); renderer.setViewport(x, y, vw, vh);
    renderer.render(scene, lookDev.cam);
    renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H);
    const f = $('frame').style; f.left = x + 'px'; f.top = y + 'px'; f.width = vw + 'px'; f.height = vh + 'px';
  } else {
    renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
}
updateHelp();
$('loading').remove();
requestAnimationFrame(loop);
</script>
</body>
</html>
